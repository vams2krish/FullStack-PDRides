<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Rides - PDRides</title>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="/css/my-rides.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-top">
            <div class="header-left">
                <a href="/map" class="back-btn">←</a>
                <div class="logo-text">🚗 PDRides</div>
            </div>
            <div class="header-right">
                <div class="live-indicator" id="liveIndicator" style="display: none;">
                    <div class="live-dot"></div>
                    <span>Live</span>
                </div>
                <button class="refresh-btn" id="refreshBtn" onclick="refreshRides()" title="Refresh">🔄</button>
                
                <!-- Mode Toggle -->
                <div class="mode-toggle" id="modeToggle" style="display: none;">
                    <button class="mode-btn active" id="driverModeBtn" onclick="switchMode('driver')">
                        🚗 Driver
                    </button>
                    <button class="mode-btn" id="passengerModeBtn" onclick="switchMode('passenger')">
                        🚙 Passenger
                    </button>
                </div>
                
                <button class="profile-btn" id="profileBtn" onclick="handleProfileClick()">
                    👤 <span id="profileName">Profile</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <h1 class="page-title">📋 My Rides</h1>

        <!-- Login Required (shown if not logged in) -->
        <div id="loginRequired" class="login-required" style="display: none;">
            <h3>🔐 Login Required</h3>
            <p>Please login to view your rides</p>
            <a href="/login" class="login-btn">Login / Register</a>
        </div>

        <!-- Stats -->
        <div id="statsSection" style="display: none;">
            <div class="stats">
                <div class="stat-card" id="totalRidesCard">
                    <div class="stat-number" id="totalRides">0</div>
                    <div class="stat-label">Total Rides</div>
                </div>
                <div class="stat-card" id="activeRidesCard">
                    <div class="stat-number" id="activeRides">0</div>
                    <div class="stat-label">Active</div>
                </div>
                <div class="stat-card" id="completedRidesCard">
                    <div class="stat-number" id="completedRides">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card highlight" id="earningsCard" style="display: none;">
                    <div class="stat-number" id="earningsAmount">$0</div>
                    <div class="stat-label" id="earningsLabel">Earnings</div>
                </div>
                <div class="stat-card highlight" id="spentCard" style="display: none;">
                    <div class="stat-number" id="spentAmount">$0</div>
                    <div class="stat-label">Total Spent</div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs" id="tabsSection" style="display: none;">
            <button class="tab active" onclick="switchTab('all')">All Rides</button>
            <button class="tab" onclick="switchTab('offered')">🚗 I Offered</button>
            <button class="tab" onclick="switchTab('joined')">🚙 I Joined</button>
        </div>

        <!-- Status Filters -->
        <div class="status-filters" id="filtersSection" style="display: none;">
            <button class="status-filter active" onclick="filterByStatus('all')">All</button>
            <button class="status-filter" onclick="filterByStatus('active')">Active</button>
            <button class="status-filter" onclick="filterByStatus('completed')">Completed</button>
            <button class="status-filter" onclick="filterByStatus('cancelled')">Cancelled</button>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading your rides...</p>
        </div>

        <!-- Rides List -->
        <div id="ridesList" class="rides-list"></div>
    </div>

    <script>
        // Auth state
        let authToken = localStorage.getItem('pdrides_token') || null;
        let userPhone = localStorage.getItem('pdrides_phone') || null;
        let userName = localStorage.getItem('pdrides_name') || 'User';

        let allOfferedRides = [];
        let allJoinedRides = [];
        let currentTab = 'all';
        let currentStatus = 'all';
        let currentMode = 'driver'; // 'driver' or 'passenger'
        let isDriver = false;
        let stats = {};
        
        // Real-time polling
        let pollInterval = null;
        let lastUpdateTime = null;
        const POLL_INTERVAL = 30000; // 30 seconds

        // Initialize
        window.onload = () => {
            initUI();
            loadRides();
            startPolling();
        };

        // Cleanup on page unload
        window.onunload = () => {
            stopPolling();
        };

        // Initialize UI based on auth state
        function initUI() {
            if (authToken && userPhone) {
                document.getElementById('loginRequired').style.display = 'none';
                document.getElementById('profileName').textContent = userName;
                document.getElementById('statsSection').style.display = 'block';
                document.getElementById('tabsSection').style.display = 'flex';
                document.getElementById('filtersSection').style.display = 'flex';
                document.getElementById('liveIndicator').style.display = 'flex';
            } else {
                document.getElementById('loginRequired').style.display = 'block';
                document.getElementById('profileName').textContent = 'Login';
            }
        }

        // Handle profile click
        function handleProfileClick() {
            if (authToken && userPhone) {
                window.location.href = '/settings';
            } else {
                window.location.href = '/login';
            }
        }

        // Start real-time polling
        function startPolling() {
            if (pollInterval) return;
            pollInterval = setInterval(() => {
                checkForUpdates();
            }, POLL_INTERVAL);
        }

        // Stop polling
        function stopPolling() {
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
        }

        // Check for real-time updates
        async function checkForUpdates() {
            if (!authToken || !userPhone) return;

            try {
                const url = lastUpdateTime 
                    ? `/api/user/ride-history/updates?lastUpdate=${encodeURIComponent(lastUpdateTime)}`
                    : '/api/user/ride-history/updates';
                
                const response = await fetch(url, {
                    headers: {
                        'phoneNumber': userPhone,
                        'token': authToken
                    }
                });
                
                const data = await response.json();
                
                if (data.success && data.rides && data.rides.length > 0) {
                    console.log('New ride updates:', data.rides.length);
                    // Reload rides if there are updates
                    loadRides(false); // false = don't show loading spinner
                }
                
                lastUpdateTime = data.timestamp;
            } catch (error) {
                console.error('Error checking for updates:', error);
            }
        }

        // Load rides from API
        async function loadRides(showLoading = true) {
            if (!authToken || !userPhone) {
                document.getElementById('loading').style.display = 'none';
                return;
            }

            if (showLoading) {
                document.getElementById('loading').classList.add('active');
                document.getElementById('ridesList').innerHTML = '';
            }

            try {
                const response = await fetch('/api/user/ride-history?limit=50', {
                    headers: {
                        'phoneNumber': userPhone,
                        'token': authToken
                    }
                });
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Failed to load rides');
                }

                // Store data
                isDriver = data.isDriver;
                currentMode = data.mode || (isDriver ? 'driver' : 'passenger');
                stats = data.stats || {};
                
                allOfferedRides = data.offeredRides || [];
                allJoinedRides = data.joinedRides || [];
                
                lastUpdateTime = new Date().toISOString();

                // Update mode toggle visibility
                updateModeToggle();
                
                // Update stats
                updateStats();
                
                // Render rides
                renderRides();

            } catch (error) {
                console.error('Error loading rides:', error);
                showError('Failed to load rides. Please try again.');
            } finally {
                if (showLoading) {
                    document.getElementById('loading').classList.remove('active');
                }
            }
        }

        // Update mode toggle based on user role
        function updateModeToggle() {
            const modeToggle = document.getElementById('modeToggle');
            
            if (isDriver) {
                modeToggle.style.display = 'flex';
                
                // Update button states
                document.getElementById('driverModeBtn').classList.toggle('active', currentMode === 'driver');
                document.getElementById('passengerModeBtn').classList.toggle('active', currentMode === 'passenger');
                
                // Update earnings/spent visibility
                document.getElementById('earningsCard').style.display = currentMode === 'driver' ? 'block' : 'none';
                document.getElementById('spentCard').style.display = currentMode === 'passenger' ? 'block' : 'none';
                document.getElementById('earningsLabel').textContent = currentMode === 'driver' ? 'Earnings' : 'Spent';
            } else {
                modeToggle.style.display = 'none';
                document.getElementById('earningsCard').style.display = 'none';
                document.getElementById('spentCard').style.display = 'block';
            }
        }

        // Switch between driver and passenger mode
        function switchMode(mode) {
            currentMode = mode;
            updateModeToggle();
            renderRides();
        }

        // Update stats
        function updateStats() {
            const modeStats = currentMode === 'driver' ? stats.offered : stats.joined;
            
            document.getElementById('totalRides').textContent = (stats.offered?.total || 0) + (stats.joined?.total || 0);
            document.getElementById('activeRides').textContent = modeStats?.active || 0;
            document.getElementById('completedRides').textContent = modeStats?.completed || 0;
            
            // Format earnings/spent
            const earnings = stats.totalEarnings || 0;
            const spent = stats.totalSpent || 0;
            
            document.getElementById('earningsAmount').textContent = '$' + earnings.toFixed(2);
            document.getElementById('spentAmount').textContent = '$' + spent.toFixed(2);
        }

        // Refresh rides manually
        async function refreshRides() {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.classList.add('spinning');
            
            await loadRides(true);
            
            setTimeout(() => {
                refreshBtn.classList.remove('spinning');
            }, 1000);
        }

        // Switch tab
        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab UI
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            renderRides();
        }

        // Filter by status
        function filterByStatus(status) {
            currentStatus = status;
            
            // Update filter UI
            document.querySelectorAll('.status-filter').forEach(f => f.classList.remove('active'));
            event.target.classList.add('active');
            
            renderRides();
        }

        // Get filtered rides based on mode and filters
        function getFilteredRides() {
            let rides = [];
            
            // Filter by mode
            if (currentMode === 'driver') {
                // Show offered rides for driver mode
                rides = allOfferedRides.map(r => ({ ...r, rideType: 'offered' }));
            } else {
                // Show joined rides for passenger mode
                rides = allJoinedRides.map(r => ({ ...r, rideType: 'joined' }));
            }

            // Apply tab filter (only if not in specific mode)
            if (currentTab === 'all') {
                // Show all rides
                if (currentMode === 'driver' && isDriver) {
                    const joined = allJoinedRides.map(r => ({ ...r, rideType: 'joined' }));
                    rides = [...rides, ...joined];
                } else if (currentMode === 'passenger') {
                    const offered = allOfferedRides.map(r => ({ ...r, rideType: 'offered' }));
                    rides = [...rides, ...offered];
                }
            } else if (currentTab === 'offered') {
                rides = allOfferedRides.map(r => ({ ...r, rideType: 'offered' }));
            } else if (currentTab === 'joined') {
                rides = allJoinedRides.map(r => ({ ...r, rideType: 'joined' }));
            }

            // Filter by status
            if (currentStatus !== 'all') {
                rides = rides.filter(r => r.status === currentStatus);
            }

            // Sort by date (newest first)
            rides.sort((a, b) => new Date(b.date) - new Date(a.date));

            return rides;
        }

        // Render rides
        function renderRides() {
            const rides = getFilteredRides();
            const ridesList = document.getElementById('ridesList');

            if (rides.length === 0) {
                const emptyMessage = currentMode === 'driver' 
                    ? "You haven't offered any rides yet" 
                    : "You haven't joined any rides yet";
                
                ridesList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🚗</div>
                        <div class="empty-title">No rides found</div>
                        <div class="empty-text">${emptyMessage}</div>
                    </div>
                `;
                return;
            }

            ridesList.innerHTML = rides.map(ride => renderRideCard(ride)).join('');
        }

        // Render a single ride card
        function renderRideCard(ride) {
            const date = ride.date ? new Date(ride.date).toLocaleDateString() : 'N/A';
            const time = ride.time || '';
            const price = (ride.contribution || 0).toFixed(2);
            const statusClass = ride.status || 'active';
            const isDriverMode = ride.rideType === 'offered';
            
            // Get driver/passenger info
            const personName = isDriverMode ? userName : (ride.driver?.name || ride.driverName || 'Driver');
            const personInitial = personName.charAt(0).toUpperCase();
            
            let cardClass = 'ride-card';
            if (isDriverMode) cardClass += ' driver-mode';
            
            let bottomSection = '';
            
            if (isDriverMode) {
                // Driver mode - show passengers
                const passengers = ride.passengers || [];
                const filledSeats = ride.filledSeats || 0;
                const earnings = (ride.totalEarnings || 0).toFixed(2);
                
                bottomSection = `
                    <div class="ride-info-grid">
                        <div class="ride-info-item">
                            <label>Seats Filled</label>
                            <span>${filledSeats} / ${ride.totalSeats}</span>
                        </div>
                        <div class="ride-info-item">
                            <label>Price/Seat</label>
                            <span>$${price}</span>
                        </div>
                    </div>
                    ${passengers.length > 0 ? `
                        <div class="passengers-section">
                            <div class="passengers-title">👥 Passengers (${passengers.length})</div>
                            ${passengers.map(p => `
                                <div class="passenger-item">
                                    <div class="passenger-avatar">${(p.name || 'P').charAt(0).toUpperCase()}</div>
                                    <span>${p.name || 'Passenger'} - ${p.seats} seat${p.seats !== 1 ? 's' : ''}</span>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                    <div class="ride-driver" style="margin-top: 10px;">
                        <div class="driver-avatar driver">${personInitial}</div>
                        <div class="driver-info">
                            <div class="driver-name">You (Driver)</div>
                        </div>
                        <div class="earnings-badge">+$${earnings}</div>
                    </div>
                `;
            } else {
                // Passenger mode - show driver info
                const seatsBooked = ride.myBooking?.seats || 1;
                const totalPaid = (ride.totalPaid || (ride.contribution * seatsBooked)).toFixed(2);
                
                bottomSection = `
                    <div class="ride-info-grid">
                        <div class="ride-info-item">
                            <label>Your Seats</label>
                            <span>${seatsBooked}</span>
                        </div>
                        <div class="ride-info-item">
                            <label>Total Paid</label>
                            <span>$${totalPaid}</span>
                        </div>
                    </div>
                    <div class="ride-driver">
                        <div class="driver-avatar">${personInitial}</div>
                        <div class="driver-info">
                            <div class="driver-name">${personName}</div>
                            ${ride.driver?.rating ? `<div class="driver-rating">⭐ ${ride.driver.rating.toFixed(1)}</div>` : ''}
                        </div>
                        <div class="ride-price">$${price}</div>
                    </div>
                `;
            }
            
            return `
                <div class="${cardClass}">
                    <div class="ride-header">
                        <div class="ride-type">
                            <span class="ride-type-badge ${ride.rideType}">
                                ${ride.rideType === 'offered' ? '🚗 I Offered' : '🚙 I Joined'}
                            </span>
                        </div>
                        <span class="ride-status ${statusClass}">${statusClass.charAt(0).toUpperCase() + statusClass.slice(1)}</span>
                    </div>
                    <div class="ride-route">
                        📍 ${ride.pickup || 'Pickup'} → 🏁 ${ride.destination || 'Destination'}
                    </div>
                    <div class="ride-details">
                        <span>📅 ${date}</span>
                        <span>⏰ ${time}</span>
                        ${ride.totalSeats ? `<span>💺 ${ride.totalSeats} seat${ride.totalSeats !== 1 ? 's' : ''}</span>` : ''}
                    </div>
                    ${bottomSection}
                </div>
            `;
        }

        // Show error
        function showError(message) {
            const ridesList = document.getElementById('ridesList');
            ridesList.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⚠️</div>
                    <div class="empty-title">Error</div>
                    <div class="empty-text">${message}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
