<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDRides - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #25D366;
            --accent-dark: #128C7E;
            --danger: #dc3545;
            --success: #28a745;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --white: #ffffff;
            --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            width: 100%;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .card-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.15);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .alert-info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #bbdefb;
        }

        .otp-section {
            display: none;
        }

        .otp-section.active {
            display: block;
        }

        .otp-input-group {
            display: flex;
            gap: 10px;
        }

        .otp-input-group input {
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 0.3em;
        }

        .resend-link {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
        }

        .resend-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .resend-link a:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #999;
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            padding: 0 15px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.95rem;
        }

        .register-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .info-box {
            background: #e3f2fd;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #1565c0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            color: #666;
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .hidden {
            display: none !important;
        }

        .privacy-note {
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.7);
            margin-top: 20px;
            line-height: 1.5;
        }

        .privacy-note a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 PDRides</h1>
            <p id="headerSubtitle">Welcome back! Login with your phone</p>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="alert" id="alertBox"></div>

                <!-- Phone Number Section -->
                <div id="phoneSection">
                    <div class="info-box">
                        ℹ️ Enter your phone number to login or create a new account.
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phoneNumber" placeholder="+1 (555) 123-4567" required>
                    </div>

                    <button class="btn btn-primary" id="sendOtpBtn" onclick="sendOTP()">
                        📱 Send Verification Code
                    </button>
                </div>

                <!-- OTP Verification Section -->
                <div id="otpSection" class="otp-section">
                    <div class="back-link" onclick="showPhoneSection()">
                        ← Change phone number
                    </div>

                    <div class="form-group">
                        <label>Enter Verification Code</label>
                        <input type="text" id="otpCode" placeholder="123456" maxlength="6" autocomplete="one-time-code">
                    </div>

                    <button class="btn btn-primary" id="verifyOtpBtn" onclick="verifyOTP()">
                        ✓ Verify & Login
                    </button>

                    <div class="resend-link">
                        Didn't receive the code? 
                        <a onclick="resendOTP()">Resend</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="register-link">
            Don't have an account? <a href="/register">Register here</a>
        </div>

        <p class="privacy-note">
            Your data is secure. Read our <a href="/privacy-policy">Privacy Policy</a> and <a href="/terms-of-service">Terms of Service</a>.
        </p>
    </div>

    <script>
        // State
        let currentPhone = '';
        let isNewUser = false;

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const registered = urlParams.get('registered');
        const verifyMode = urlParams.get('mode');
        const verifyPhone = urlParams.get('phone');
        
        // Check if already logged in
        const authToken = localStorage.getItem('pdrides_token') || null;
        const userPhone = localStorage.getItem('pdrides_phone') || null;

        // Redirect if already logged in
        if (authToken && userPhone) {
            window.location.href = '/map';
            // Don't return - let the script continue to redirect
        }
        
        // Handle successful registration
        if (registered === 'true') {
            showAlert('success', 'Account created successfully! Please login.');
        }
        
        // Handle verification mode from registration
        if (verifyMode === 'verify' && verifyPhone) {
            // Pre-fill phone and auto-send OTP for registration verification
            document.getElementById('phoneNumber').value = decodeURIComponent(verifyPhone);
            // Automatically send OTP after a short delay
            setTimeout(() => {
                // Use the stored pending data from registration
                sendOTPFromRegistration(decodeURIComponent(verifyPhone));
            }, 500);
        }
        
        // Send OTP from registration (uses pending registration data)
        async function sendOTPFromRegistration(phone) {
            currentPhone = phone;
            
            const btn = document.getElementById('sendOtpBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>Sending...';

            try {
                const response = await fetch('/api/auth/request-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phoneNumber: phone,
                        isRegistrationVerification: true  // Flag to indicate this is for registration verification
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Store phone for verification
                    localStorage.setItem('pdrides_login_phone', phone);
                    
                    // Show OTP section
                    document.getElementById('phoneSection').classList.add('hidden');
                    document.getElementById('otpSection').classList.remove('hidden');
                    document.getElementById('otpSection').classList.add('active');
                    document.getElementById('headerSubtitle').textContent = 'Verify your phone to complete registration';
                    
                    // Show success message
                    showAlert('info', 'Please enter the verification code sent to your phone.');
                    
                    // For testing: show OTP
                    console.log('OTP:', data.otp);
                    if (data.otp) {
                        showAlert('info', 'Verification code: ' + data.otp + ' (for testing)');
                    }
                    
                    // Focus on OTP input
                    setTimeout(() => {
                        document.getElementById('otpCode').focus();
                    }, 100);
                } else {
                    throw new Error(data.error || 'Failed to send OTP');
                }
            } catch (error) {
                console.error('Send OTP error:', error);
                showAlert('error', error.message || 'Failed to send verification code. Please try again.');
                btn.disabled = false;
                btn.innerHTML = '📱 Send Verification Code';
            }
        }

        // Show alert
        function showAlert(type, message) {
            const alert = document.getElementById('alertBox');
            alert.className = 'alert alert-' + type + ' show';
            alert.textContent = message;
            window.scrollTo(0, 0);
        }

        function hideAlert() {
            document.getElementById('alertBox').classList.remove('show');
        }

        // Show phone section
        function showPhoneSection() {
            document.getElementById('phoneSection').classList.remove('hidden');
            document.getElementById('otpSection').classList.remove('active');
            document.getElementById('otpSection').classList.add('hidden');
            document.getElementById('headerSubtitle').textContent = 'Welcome back! Login with your phone';
        }

        // Send OTP
        async function sendOTP() {
            const phone = document.getElementById('phoneNumber').value.trim();
            
            if (!phone) {
                showAlert('error', 'Please enter your phone number');
                return;
            }

            // Validate phone format (basic validation)
            const cleanedPhone = phone.replace(/\D/g, '');
            if (cleanedPhone.length < 10) {
                showAlert('error', 'Please enter a valid phone number');
                return;
            }

            const btn = document.getElementById('sendOtpBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>Sending...';

            try {
                const response = await fetch('/api/auth/request-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phoneNumber: phone
                    })
                });

                const data = await response.json();

                if (data.success) {
                    currentPhone = phone;
                    isNewUser = data.isNewUser;
                    
                    // Store phone for verification
                    localStorage.setItem('pdrides_login_phone', phone);
                    
                    // Show OTP section
                    document.getElementById('phoneSection').classList.add('hidden');
                    document.getElementById('otpSection').classList.remove('hidden');
                    document.getElementById('otpSection').classList.add('active');
                    document.getElementById('headerSubtitle').textContent = 'Enter the code sent to ' + formatPhone(phone);
                    
                    // Focus on OTP input
                    setTimeout(() => {
                        document.getElementById('otpCode').focus();
                    }, 100);
                    
                    // If new user, show info
                    if (data.isNewUser) {
                        showAlert('info', 'New account detected. Complete registration after verification.');
                    }
                    
                    // For testing: show OTP in console and alert
                    console.log('OTP:', data.otp);
                    if (data.otp) {
                        // Development mode: show OTP for testing
                        showAlert('info', 'Verification code: ' + data.otp + ' (for testing)');
                    }
                } else {
                    throw new Error(data.error || 'Failed to send OTP');
                }
            } catch (error) {
                console.error('Send OTP error:', error);
                showAlert('error', error.message || 'Failed to send verification code. Please try again.');
                btn.disabled = false;
                btn.innerHTML = '📱 Send Verification Code';
            }
        }

        // Verify OTP
        async function verifyOTP() {
            const otp = document.getElementById('otpCode').value.trim();
            
            if (!otp) {
                showAlert('error', 'Please enter the verification code');
                return;
            }

            if (otp.length !== 6) {
                showAlert('error', 'Please enter a 6-digit verification code');
                return;
            }

            const btn = document.getElementById('verifyOtpBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>Verifying...';

            try {
                const response = await fetch('/api/auth/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phoneNumber: currentPhone,
                        otpCode: otp
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Check if this is a new user from server response
                    if (data.isNewUser) {
                        // New user - redirect to registration
                        localStorage.setItem('pdrides_pending_phone', currentPhone);
                        localStorage.setItem('pdrides_pending_token', data.token);
                        window.location.href = '/register?mode=verify&phone=' + encodeURIComponent(currentPhone);
                    } else {
                        // Existing user - complete login
                        // Store token and user info
                        localStorage.setItem('pdrides_token', data.token);
                        localStorage.setItem('pdrides_phone', currentPhone);
                        
                        // Store user data including name for display across the app
                        if (data.user && data.user.name) {
                            localStorage.setItem('pdrides_name', data.user.name);
                        }
                        localStorage.setItem('pdrides_user', JSON.stringify(data.user));
                        
                        // Store user name in localStorage for display across the app
                        if (data.user && data.user.name) {
                            localStorage.setItem('pdrides_name', data.user.name);
                        }
                        
                        // Redirect to map
                        window.location.href = '/map';
                    }
                } else {
                    throw new Error(data.error || 'Verification failed');
                }
            } catch (error) {
                console.error('Verify OTP error:', error);
                showAlert('error', error.message || 'Verification failed. Please try again.');
                btn.disabled = false;
                btn.innerHTML = '✓ Verify & Login';
            }
        }

        // Resend OTP
        async function resendOTP() {
            await sendOTP();
        }

        // Format phone for display
        function formatPhone(phone) {
            const cleaned = phone.replace(/\D/g, '');
            if (cleaned.length === 10) {
                return '(' + cleaned.slice(0,3) + ') ' + cleaned.slice(3,6) + '-' + cleaned.slice(6);
            }
            return phone;
        }

        // Handle Enter key
        document.getElementById('phoneNumber').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendOTP();
            }
        });

        document.getElementById('otpCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyOTP();
            }
        });

        // Auto-focus OTP input on mobile
        if (window.innerWidth < 500) {
            document.getElementById('otpCode').addEventListener('focus', function() {
                // Scroll to input on mobile
                setTimeout(() => {
                    this.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
            });
        }
    </script>
</body>
</html>
